<!-- ======================================================
FILE: /admin/live-service.html
PROJECT: IATTV Website
PURPOSE:
Protected administration page for the public
live invitation card (editable at will).
====================================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>IATTV Admin | Live Invitation</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-dashboard-body">

  <div id="adminLoading" class="admin-loading">
    <div class="admin-loading-brand">IATTV</div>
    <p>Verifying administrator access...</p>
  </div>

  <div id="adminApp" class="admin-app" hidden>

    <header class="admin-header">
      <div class="admin-header-brand">
        <a href="/admin/dashboard.html" class="admin-header-logo">IATTV</a>
        <div class="admin-header-label">Ministry Administration</div>
      </div>
      <div class="admin-header-user">
        <span id="adminName"></span>
        <button id="signOutButton" class="admin-signout-button" type="button">Sign Out</button>
      </div>
    </header>

    <main class="admin-dashboard">

      <section class="dashboard-intro">
        <p class="dashboard-eyebrow">CONTENT MANAGEMENT</p>
        <h1>Live Invitation</h1>
        <p>
          Edit the homepage invitation card. Change the name, day, time,
          and buttons whenever you want. English and Spanish are separate.
        </p>
      </section>

      <section class="admin-panel">
        <form id="liveServiceForm">
          <div class="admin-form-grid">

            <div class="form-group admin-form-full">
              <label class="admin-checkbox-row">
                <input id="enabled" type="checkbox">
                <span>Enable the live link on the website</span>
              </label>
            </div>

            <div class="form-group admin-form-full">
              <label for="title">Invitation title</label>
              <input
                id="title"
                type="text"
                placeholder="Sábados de Maravillas y Milagros"
                required
              >
            </div>

            <div class="form-group">
              <label for="inviteLabelEn">Label (English)</label>
              <input id="inviteLabelEn" type="text" placeholder="You’re Invited" required>
            </div>

            <div class="form-group">
              <label for="inviteLabelEs">Label (Spanish)</label>
              <input id="inviteLabelEs" type="text" placeholder="Estás invitado" required>
            </div>

            <div class="form-group">
              <label for="dayLineEn">Day line (English)</label>
              <input id="dayLineEn" type="text" placeholder="Saturdays" required>
            </div>

            <div class="form-group">
              <label for="dayLineEs">Day line (Spanish)</label>
              <input id="dayLineEs" type="text" placeholder="Sábados" required>
            </div>

            <div class="form-group">
              <label for="serviceTime">Time</label>
              <input id="serviceTime" type="text" placeholder="7:00 PM" required>
            </div>

            <div class="form-group">
              <label for="timeZone">Time zone</label>
              <input id="timeZone" type="text" placeholder="EST" required>
            </div>

            <div class="form-group">
              <label for="featuresEn">Line under the time (English)</label>
              <input id="featuresEn" type="text" placeholder="Faith • Word • Power" required>
            </div>

            <div class="form-group">
              <label for="featuresEs">Line under the time (Spanish)</label>
              <input id="featuresEs" type="text" placeholder="Fe • Palabra • Poder" required>
            </div>

            <div class="form-group">
              <label for="ctaEn">Card button (English)</label>
              <input id="ctaEn" type="text" placeholder="Join us this Saturday" required>
            </div>

            <div class="form-group">
              <label for="ctaEs">Card button (Spanish)</label>
              <input id="ctaEs" type="text" placeholder="Entra este sábado" required>
            </div>

            <div class="form-group">
              <label for="headerButtonEn">Header button (English)</label>
              <input id="headerButtonEn" type="text" placeholder="Watch Live" required>
            </div>

            <div class="form-group">
              <label for="headerButtonEs">Header button (Spanish)</label>
              <input id="headerButtonEs" type="text" placeholder="En vivo" required>
            </div>

            <div class="form-group admin-form-full">
              <label for="liveUrl">Live URL</label>
              <input id="liveUrl" type="url" placeholder="https://..." required>
            </div>

            <div class="form-group admin-form-full">
              <label for="note">Private note (not shown on the site)</label>
              <textarea id="note" rows="3" placeholder="YouTube, Facebook, etc."></textarea>
            </div>

          </div>

          <div class="admin-form-actions">
            <button
              id="saveButton"
              class="admin-login-button admin-form-submit"
              type="submit"
              disabled
            >
              Save invitation
            </button>
            <p id="formStatus" class="login-message" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section id="savedPreview" class="admin-panel" hidden>
        <div class="admin-panel-heading">
          <div>
            <p class="dashboard-eyebrow">CURRENT SETTINGS</p>
            <h2>Saved invitation</h2>
          </div>
        </div>
        <div id="savedPreviewContent"></div>
      </section>

    </main>
  </div>

  <script type="module" src="/js/admin/live-service-admin.js?v=3"></script>
</body>
</html>
