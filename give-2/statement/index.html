<!-- ======================================================
FILE: /give-2/statement/index.html
PROJECT: IATTV Website
PURPOSE:
Public Give 2 statement request page. Donor enters email
and date range to view recorded gifts on screen.
====================================================== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giving Statement | IATTV</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/give-2.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand" aria-label="IATTV Home">
          <span class="brand-name">IATTV</span>
          <span class="brand-tagline">I AM THE TRUE VINE</span>
        </a>
        <nav class="main-nav" id="mainNav">
          <a href="/">Home</a>
          <a href="/give-2/">Give 2</a>
        </nav>
      </div>
    </header>

    <main class="give2-page">
      <section class="give2-section">
        <div class="give2-card">
          <p class="section-eyebrow">GIVING RECORDS</p>
          <h1>Request a Statement</h1>
          <p class="give2-intro">
            Enter the email used with your gift and choose a date range.
          </p>

          <form id="statementForm">
            <div class="give2-group">
              <label for="statementEmail">Email</label>
              <input id="statementEmail" type="email" required autocomplete="email" />
            </div>

            <div class="give2-group">
              <h2>Date range</h2>
              <div class="give2-toggle">
                <button type="button" class="give2-freq" data-range="week">This week</button>
                <button type="button" class="give2-freq" data-range="month">This month</button>
                <button type="button" class="give2-freq active" data-range="year">This year</button>
                <button type="button" class="give2-freq" data-range="custom">Custom</button>
              </div>
            </div>

            <div class="give2-grid" id="customDates" hidden>
              <div>
                <label for="fromDate">From</label>
                <input id="fromDate" type="date" />
              </div>
              <div>
                <label for="toDate">To</label>
                <input id="toDate" type="date" />
              </div>
            </div>

            <button class="button button-gold give2-submit" type="submit">
              View Statement
            </button>
            <p id="statementStatus" class="give2-status"></p>
          </form>

          <div id="statementResult" hidden>
            <h2 id="statementTitle"></h2>
            <p id="statementMeta"></p>
            <div id="statementRows"></div>
            <p id="statementTotal"></p>
            <p id="statementNote" class="give2-note"></p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/js/modules/give-2/public-statement.js"></script>
  </body>
</html>
